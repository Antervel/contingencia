name: Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Build stage (matrix: one entry per image we build; adding an image later is a
  # one-line change to the matrix below). Each image is pushed under a temporary tag
  # so it can flow unchanged from build to test to publish.
  build:
    name: build-${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mta
            dockerfile: mta/Dockerfile
          - image: imap
            dockerfile: imap/Dockerfile
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build timestamp
        id: created
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image and push temporary tag for the test gate
        id: image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:e1-13-tmp-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.ts }}

  # Test stage: runs only after the matching build succeeded; gates publishing.
  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull freshly built images (temporary tags)
        run: |
          docker pull "ghcr.io/${{ github.repository }}/mta:e1-13-tmp-${{ github.sha }}"
          docker pull "ghcr.io/${{ github.repository }}/imap:e1-13-tmp-${{ github.sha }}"

      - name: Start stack from freshly built images and wait for healthy state
        run: CONTINGENCY_TAG=e1-13-tmp-${{ github.sha }} docker compose -f compose.release.yaml up -d --wait

      - name: Postfix configuration check (mta)
        run: docker compose -f compose.release.yaml exec -T mta postfix check

      - name: Dovecot configuration check (imap)
        run: docker compose -f compose.release.yaml exec -T imap doveconf -n

      - name: Run scenario suite
        run: sh prototype/tests/run-all.sh

      - name: Collect container logs for diagnostics
        if: failure()
        run: |
          docker compose -f compose.release.yaml logs --no-color mta imap main > /tmp/e1-13-compose-logs.txt || true

      - name: Upload logs and test output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e1-13-failure-artifacts
          path: /tmp/e1-13-compose-logs.txt
          if-no-files-found: ignore

  # Publish stage: only for pushes to main and manual runs, and only if build and test passed.
  publish:
    name: publish
    needs: [build, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images (full commit hash and latest)
        run: |
          set -euo pipefail
          for image in mta imap; do
            tmp="ghcr.io/${{ github.repository }}/${image}:e1-13-tmp-${{ github.sha }}"
            final="ghcr.io/${{ github.repository }}/${image}"
            docker pull "$tmp"
            docker tag "$tmp" "${final}:${{ github.sha }}"
            docker tag "$tmp" "${final}:latest"
            docker push "${final}:${{ github.sha }}"
            docker push "${final}:latest"
          done
