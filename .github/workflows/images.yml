name: Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Build stage (matrix: one entry per image we build; adding an image later is a
  # one-line change to the matrix below). Each image is pushed under a temporary tag
  # so it can flow unchanged from build to test to publish.
  build:
    name: build-${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mta
            dockerfile: mta/Dockerfile
          - image: imap
            dockerfile: imap/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repository
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Record build timestamp
        id: created
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image and push temporary tag for the test gate
        id: image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.image }}:e1-13-tmp-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.created.outputs.ts }}

  # Test stage: runs only after the matching build succeeded; gates publishing.
  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Drive exactly the release stack this gate starts. The scenario suite
      # reads COMPOSE_FILE, so `exec`/`start`/`stop` act on the containers built
      # from the freshly built images instead of a locally built prototype.
      COMPOSE_FILE: compose.release.yaml
      COMPOSE_PROJECT_NAME: contingencia-ci
      CONTINGENCY_TAG: e1-13-tmp-${{ github.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repository
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Pull freshly built images (temporary tags)
        run: |
          set -euo pipefail
          docker pull "ghcr.io/${{ steps.repo.outputs.name }}/mta:${CONTINGENCY_TAG}"
          docker pull "ghcr.io/${{ steps.repo.outputs.name }}/imap:${CONTINGENCY_TAG}"

      - name: Start stack from freshly built images and wait for healthy state
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=2
          while [ "$attempt" -le "$max_attempts" ]; do
            if docker compose -f "$COMPOSE_FILE" up -d --wait; then
              echo "stack started from freshly built images on attempt ${attempt}"
              exit 0
            fi
            echo "stack start failed on attempt ${attempt}; retrying (${max_attempts} attempts max)"
            attempt=$((attempt + 1))
            sleep 15
          done
          echo "stack start failed after ${max_attempts} attempts"
          exit 1

      - name: Verify the stack runs the freshly built images
        run: |
          set -euo pipefail
          # The gate is only meaningful if it tests the artifacts that will be
          # published, not a cached or locally built image.
          for svc in mta imap; do
            want="$(docker image inspect --format '{{.Id}}' \
              "ghcr.io/${{ steps.repo.outputs.name }}/${svc}:${CONTINGENCY_TAG}")"
            cid="$(docker compose -f "$COMPOSE_FILE" ps -q "$svc")"
            got="$(docker inspect --format '{{.Image}}' "$cid")"
            if [ "$want" != "$got" ]; then
              echo "::error::${svc} is not running the freshly built image (want ${want}, got ${got})"
              exit 1
            fi
            echo "${svc}: running freshly built image ${got}"
          done

      - name: Postfix configuration check (mta)
        run: docker compose -f "$COMPOSE_FILE" exec -T mta postfix check

      - name: Dovecot configuration check (imap)
        run: docker compose -f "$COMPOSE_FILE" exec -T imap doveconf -n

      - name: Run scenario suite
        run: sh prototype/tests/run-all.sh

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          {
            echo '=== docker compose ps -a ==='
            docker compose -f "$COMPOSE_FILE" ps -a || true
            echo
            echo '=== docker compose images ==='
            docker compose -f "$COMPOSE_FILE" images || true
            echo
            echo '=== postfix queue (postqueue -j) ==='
            docker compose -f "$COMPOSE_FILE" exec -T mta postqueue -j || true
            echo
            echo '=== postfix mailq ==='
            docker compose -f "$COMPOSE_FILE" exec -T mta mailq || true
            echo
            echo '=== container logs ==='
            docker compose -f "$COMPOSE_FILE" logs --no-color mta imap main || true
          } > /tmp/e1-13-diagnostics.txt 2>&1

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e1-13-failure-artifacts
          path: /tmp/e1-13-diagnostics.txt
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v --remove-orphans || true

  # Publish stage: only for pushes to main and manual runs, and only if build and test passed.
  publish:
    name: publish
    needs: [build, test]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repository
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Publish images (full commit hash and latest)
        run: |
          set -euo pipefail
          for image in mta imap; do
            tmp="ghcr.io/${{ steps.repo.outputs.name }}/${image}:e1-13-tmp-${{ github.sha }}"
            final="ghcr.io/${{ steps.repo.outputs.name }}/${image}"
            docker pull "$tmp"
            docker tag "$tmp" "${final}:${{ github.sha }}"
            docker tag "$tmp" "${final}:latest"
            docker push "${final}:${{ github.sha }}"
            docker push "${final}:latest"
          done
