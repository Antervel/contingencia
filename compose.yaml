# Prototype stack for Epic 1 of the Contingency Mail Appliance.
#
# E1-02 replaced the `main` placeholder with the fake SMTP sink (Mailpit).
# Real Postfix (mta) and Dovecot (imap) images and configurations arrive in
# later tickets (E1-03, E1-04).

services:
  mta:
    image: debian:trixie-slim
    command: ["sleep", "infinity"]
    networks:
      - appliance
    ports:
      - "127.0.0.1:2525:25"
      - "127.0.0.1:5587:587"
    volumes:
      - ./prototype/config:/config:ro
      - queue:/var/spool/postfix

  imap:
    image: debian:trixie-slim
    command: ["sleep", "infinity"]
    networks:
      - appliance
    ports:
      - "127.0.0.1:1143:143"
    volumes:
      - ./prototype/config:/config:ro
      - mail:/var/mail/vhosts

  main:
    image: axllent/mailpit:latest
    networks:
      - appliance
    ports:
      - "127.0.0.1:2526:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit:/data
    environment:
      MP_DATABASE: /data/mailpit.db

volumes:
  mail:
  queue:
  mailpit:

networks:
  appliance:
    driver: bridge
