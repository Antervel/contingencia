# Prototype stack for Epic 1 of the Contingency Mail Appliance.
#
# E1-03 gave the `imap` service a real Dovecot image and hand-written
# prototype configuration. E1-04 gave the `mta` service a baseline Postfix
# image and hand-written configuration. The final admin-generated Postfix and
# Dovecot configurations arrive later.

services:
  mta:
    build:
      context: .
      dockerfile: mta/Dockerfile
    depends_on:
      imap:
        condition: service_started
    networks:
      - appliance
    ports:
      - "127.0.0.1:2525:25"
      - "127.0.0.1:5587:587"
    volumes:
      - ./prototype/config:/config:ro
      - queue:/var/spool/postfix
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/25'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  imap:
    build:
      context: .
      dockerfile: imap/Dockerfile
    networks:
      - appliance
    ports:
      - "127.0.0.1:1143:143"
    volumes:
      - ./prototype/config:/config:ro
      - mail:/var/mail/vhosts
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/143'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  main:
    image: axllent/mailpit:latest
    networks:
      - appliance
    ports:
      - "127.0.0.1:2526:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit:/data
    environment:
      MP_DATABASE: /data/mailpit.db

volumes:
  mail:
  queue:
  mailpit:

networks:
  appliance:
    driver: bridge
