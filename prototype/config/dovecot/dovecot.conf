# Dovecot configuration for the prototype (mounted read-only at /config, ticket E1-03;
# passwd-file content owned by ticket E1-10: reference/generated/dovecot/users).
#
# One passwd-file answers both the login name and the internal delivery name of a
# mailbox, so both names share one Maildir (EPIC section 3.2, hypotheses H3 and H7).

dovecot_config_version = 2.4.4
dovecot_storage_version = 2.4.0

protocols = imap lmtp

listen = *

# Maildir storage: one mailbox per user under the home directory from the passwd-file.
mail_driver = maildir
mail_path = ~/Maildir
mail_inbox_path = ~/Maildir

# Plain authentication is fine inside the private prototype network;
# TLS for the final appliance comes later (Epic 5).
auth_allow_cleartext = yes
auth_mechanisms = plain login

passdb passwd-file {
  driver = passwd-file
  default_password_scheme = crypt
  passwd_file_path = /config/dovecot/users
}

userdb passwd-file {
  passwd_file_path = /config/dovecot/users
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service auth {
  # Postfix (mta container) performs SASL authentication over the private network.
  inet_listener auth {
    port = 12345
  }
}

protocol lmtp {
  postmaster_address = postmaster@client.test
}
